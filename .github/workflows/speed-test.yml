# Weekly automated speed test of ivyproschool.com using Google PageSpeed Insights.
# Results appear on the run page (summary table) and as a downloadable CSV/JSON report.
# Needs a repository secret named PSI_API_KEY (see scripts/speed-test/README.md).

name: Weekly speed test

on:
  schedule:
    # Every Monday at 03:00 IST (Sunday 21:30 UTC).
    - cron: '30 21 * * 0'
  workflow_dispatch:
    inputs:
      fail_below:
        description: 'Fail the run if any page scores below this (0 to 100). Leave empty to only report.'
        required: false
        default: ''

jobs:
  speed-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Run speed test
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          FAIL_BELOW: ${{ github.event.inputs.fail_below }}
        run: |
          if [ -n "$FAIL_BELOW" ]; then
            node scripts/speed-test/run.mjs --fail-below="$FAIL_BELOW"
          else
            node scripts/speed-test/run.mjs
          fi

      - name: Show summary on the run page
        if: always()
        run: |
          if [ -f speed-results/summary.md ]; then
            cat speed-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-report
          path: speed-results/
          retention-days: 90
