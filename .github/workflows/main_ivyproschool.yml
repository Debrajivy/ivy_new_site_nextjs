# Build Next.js on GitHub's runner, then ship the built app to Azure App Service (ivyproschool).
# Azure no longer builds anything, so the App Service plan's memory limit is not a problem.

name: Build and deploy Next.js to Azure Web App - ivyproschool

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # TEMPORARY FIX: Next.js 15.4.x crashes when Google Fonts returns a font URL
      # without a file extension ("Cannot read properties of null (reading '1')"
      # in next/font/google/loader.js). Next.js 16 fixes this. Remove this step
      # after upgrading Next.js or moving fonts to next/font/local.
      - name: Patch next/font Google loader
        run: |
          node -e '
            const fs = require("fs");
            const f = "node_modules/next/dist/compiled/@next/font/dist/google/loader.js";
            let s = fs.readFileSync(f, "utf8");
            const from = "/\\.(woff|woff2|eot|ttf|otf)$/.exec(googleFontFileUrl)[1]";
            const to   = "(/\\.(woff|woff2|eot|ttf|otf)$/.exec(googleFontFileUrl) || [null, \"woff2\"])[1]";
            if (s.includes(from)) { fs.writeFileSync(f, s.replace(from, to)); console.log("patched"); }
            else { console.log("pattern not found, skipping (Next.js may already be fixed)"); }
          '

      # NEXT_PUBLIC_* values are baked into the JS at build time, so they must be
      # available here (Azure app settings are not visible to this build).
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_PROJECT_ID }}
          NEXT_PUBLIC_LEAD_SQUARED_API_HOST: ${{ secrets.NEXT_PUBLIC_LEAD_SQUARED_API_HOST }}
          NEXT_PUBLIC_LEAD_SQUARED_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_LEAD_SQUARED_ACCESS_KEY }}
          NEXT_PUBLIC_LEAD_SQUARED_SECRET_KEY: ${{ secrets.NEXT_PUBLIC_LEAD_SQUARED_SECRET_KEY }}
        run: npm run build

      - name: Remove dev dependencies
        run: npm prune --omit=dev

      # One zip file uploads far faster than thousands of loose node_modules files.
      - name: Zip app for deployment
        run: zip -r -q -y release.zip . -x ".git/*" ".github/*" ".next/cache/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ivyproschool'
          slot-name: 'Production'
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A6EEFF2DAFDF41C6850CCCC675805C05 }}
